<?xml version="1.0" encoding="UTF-8"?>
<!--
  RektBench mark: a tiny CRT monitor with a phosphor amber "R" on the
  screen, scanlines, a soft glow, and a lit power LED, built to match
  the terminal theme in crt.css (same phosphor colors and the dark
  screen background). Kept simple and high contrast so it still reads
  clearly at 16 to 32px as a favicon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%"  stop-color="#3a2410"/>
      <stop offset="55%" stop-color="#1a130b"/>
      <stop offset="100%" stop-color="#0c0805"/>
    </radialGradient>
    <linearGradient id="letterFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffd699"/>
      <stop offset="55%"  stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#cc7a1a"/>
    </linearGradient>
    <linearGradient id="bezelFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#2b2f38"/>
      <stop offset="100%" stop-color="#14161b"/>
    </linearGradient>
    <filter id="ledGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="7" y="7" width="50" height="42" rx="4"/>
    </clipPath>
  </defs>

  <!-- outer monitor shell -->
  <rect x="2" y="2" width="60" height="52" rx="7" fill="url(#bezelFill)" stroke="#050608" stroke-width="1.5"/>

  <!-- screen -->
  <rect x="7" y="7" width="50" height="42" rx="4" fill="url(#screenGlow)"/>

  <g clip-path="url(#screenClip)">
    <!-- the R -->
    <text x="32" y="34" text-anchor="middle" dominant-baseline="middle"
          font-family="ui-monospace, 'Courier New', Consolas, monospace"
          font-weight="700" font-size="34" fill="url(#letterFill)">R</text>

    <!-- scanlines -->
    <g stroke="#000" stroke-opacity="0.28" stroke-width="1">
      <line x1="7" y1="14" x2="57" y2="14"/>
      <line x1="7" y1="21" x2="57" y2="21"/>
      <line x1="7" y1="28" x2="57" y2="28"/>
      <line x1="7" y1="35" x2="57" y2="35"/>
      <line x1="7" y1="42" x2="57" y2="42"/>
    </g>

    <!-- top screen sheen -->
    <rect x="7" y="7" width="50" height="10" fill="#fff" fill-opacity="0.05"/>
  </g>

  <!-- screen bezel rim -->
  <rect x="7" y="7" width="50" height="42" rx="4" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="1"/>

  <!-- base / stand -->
  <rect x="24" y="54" width="16" height="4" rx="1.5" fill="#1c1f26"/>
  <rect x="18" y="58" width="28" height="3" rx="1.5" fill="#14161b"/>

  <!-- power LED -->
  <circle cx="52.5" cy="46" r="1.6" fill="#ffb84d" filter="url(#ledGlow)"/>
</svg>
